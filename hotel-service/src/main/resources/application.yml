server:
  port: 8081

spring:
  application:
    name: hotel-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:h2:mem:hotel
  jpa:
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"

app:
  jwt-secret: "${HOTEL_BOOKING_JWT_SECRET}"

logging:
  pattern:
    level: "%5p traceId=%X{traceId:-}"
