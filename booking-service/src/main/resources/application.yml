server:
  port: 8082

spring:
  application:
    name: booking-service
  mvc:
    problemdetails:
      enabled: true
  cloud:
    loadbalancer:
      cache:
        enabled: false
  datasource:
    url: jdbc:h2:mem:booking
  jpa:
    open-in-view: false

eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"

app:
  jwt-secret: "${HOTEL_BOOKING_JWT_SECRET}"

logging:
  pattern:
    level: "%5p traceId=%X{traceId:-}"
